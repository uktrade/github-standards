repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.14.10
  hooks:
    # Run the ruff linter and formatter using just command
    - id: ruff-check
    - id: ruff-format

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0  
  hooks:
  - id: check-toml
  - id: no-commit-to-branch

- repo: https://github.com/rhysd/actionlint
  rev: v1.7.12
  hooks:
    - id: actionlint

# Runs the hook code from the working copy inside the published image, which provides trufflehog and Presidio.
# The image sets FORCE_HOOK_CHECKS=1 so it checks consuming repos for a github-standards entry. This repository's
# own config doesn't have one so turn the check off
- repo: local
  hooks:
  -   id: run-security-scan
      name: run-security-scan
      entry: -e FORCE_HOOK_CHECKS=0 --entrypoint python ghcr.io/uktrade/github-standards:latest -m src.hooks.cli run_scan --verbose
      language: docker_image
      stages: [pre-commit]
      verbose: true
      require_serial: true

  -   id: validate-security-scan
      name: validate-security-scan
      entry: -e FORCE_HOOK_CHECKS=0 --entrypoint python ghcr.io/uktrade/github-standards:latest -m src.hooks.cli validate_scan --verbose
      language: docker_image
      stages: [commit-msg]
      verbose: true
  